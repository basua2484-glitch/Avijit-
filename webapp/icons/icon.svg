<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />

  <!-- Main Building / Hostel Silhouette -->
  <g filter="url(#dropShadow)">
    <path d="M128 400 V230 L256 130 L384 230 V400 H128 Z" fill="#FFFFFF" fill-opacity="0.96"/>
    <path d="M256 130 L384 230 V400 H320 V270 H192 V400 H128 V230 Z" fill="#F8FAFC"/>
    
    <!-- Hostel Windows Grid -->
    <rect x="168" y="240" width="36" height="36" rx="6" fill="#1E40AF" />
    <rect x="308" y="240" width="36" height="36" rx="6" fill="#1E40AF" />
    <rect x="168" y="296" width="36" height="36" rx="6" fill="#1E40AF" />
    <rect x="308" y="296" width="36" height="36" rx="6" fill="#1E40AF" />

    <!-- Main Entry Archway -->
    <path d="M224 400 V320 C224 302 288 302 288 320 V400 Z" fill="#1E293B" />
  </g>

  <!-- Golden Food / Mess Badge Overlay -->
  <g filter="url(#dropShadow)">
    <circle cx="380" cy="140" r="54" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Fork & Spoon / Cloche Icon -->
    <path d="M366 122 V142 M361 122 V134 M371 122 V134 M361 134 C361 140 371 140 371 134 M366 142 V158" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M394 122 C388 122 384 128 384 136 C384 142 388 145 394 145 V158 M394 145 C399 145 403 141 403 136 C403 128 399 122 394 122" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Clock Shift / Attendance Badge Overlay -->
  <g filter="url(#dropShadow)">
    <circle cx="132" cy="140" r="54" fill="#10B981" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Clock Hands -->
    <circle cx="132" cy="140" r="32" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <polyline points="132,122 132,140 146,140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
